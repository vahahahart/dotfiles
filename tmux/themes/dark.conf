set -g @tmux-dotbar-bg "#1e1e1e"
set -g @tmux-dotbar-fg "#d4d4d4"
set -g @tmux-dotbar-fg-current "#569cd6"
set -g @tmux-dotbar-fg-session "#a0a0a0"
set -g @tmux-dotbar-fg-prefix "#c586c0"

set -g status-style "bg=#1e1e1e,fg=#d4d4d4"
set -g pane-border-style "fg=#454545,bg=default"
set -g pane-active-border-style "fg=#569cd6,bg=default"
set -g mode-style "bg=#264f78,fg=#d4d4d4"
set -g message-style "bg=#1e1e1e,fg=#d4d4d4"
