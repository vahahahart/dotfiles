set -g @tmux-dotbar-bg "#ffffff"
set -g @tmux-dotbar-fg "#343434"
set -g @tmux-dotbar-fg-current "#007acc"
set -g @tmux-dotbar-fg-session "#6f6f6f"
set -g @tmux-dotbar-fg-prefix "#af00db"

set -g status-style "bg=#ffffff,fg=#343434"
set -g pane-border-style "fg=#dddddd,bg=default"
set -g pane-active-border-style "fg=#007acc,bg=default"
set -g mode-style "bg=#add6ff,fg=#343434"
set -g message-style "bg=#ffffff,fg=#343434"
