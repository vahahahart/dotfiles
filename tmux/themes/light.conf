set -g @tmux-dotbar-bg "#ffffff"
set -g @tmux-dotbar-fg "#24292f"
set -g @tmux-dotbar-fg-current "#0f6cbd"
set -g @tmux-dotbar-fg-session "#616161"
set -g @tmux-dotbar-fg-prefix "#8764b8"

set -g status-style "bg=#ffffff,fg=#24292f"
set -g pane-border-style "fg=#b3b3b3,bg=default"
set -g pane-active-border-style "fg=#0f6cbd,bg=default"
set -g mode-style "bg=#add6ff,fg=#24292f"
set -g message-style "bg=#ffffff,fg=#24292f"
