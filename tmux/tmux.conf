set -g mouse on

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"

bind -n M-c new-window
bind -n M-x kill-pane
bind -n M-X kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

# Russian ЙЦУКЕН aliases for the same physical Alt keys.
bind -n M-р select-pane -L
bind -n M-о select-pane -D
bind -n M-л select-pane -U
bind -n M-д select-pane -R

bind -n M-Р resize-pane -L 5
bind -n M-О resize-pane -D 5
bind -n M-Л resize-pane -U 5
bind -n M-Д resize-pane -R 5

bind -n M-м split-window -h
bind -n M-ы split-window -v
bind -n M-с new-window
bind -n M-ч kill-pane
bind -n M-Ч kill-window
bind -n M-в detach
bind -n M-Й confirm-before -p "Kill entire session? (y/n)" kill-session

bind R source-file ~/dotfiles/tmux/tmux.conf \; display-message 'Configuration reloaded'
bind К source-file ~/dotfiles/tmux/tmux.conf \; display-message 'Configuration reloaded'
bind ? list-keys
bind / list-keys -a

# Russian aliases for common default commands after the prefix.
bind с new-window
bind т next-window
bind з previous-window
bind д last-window
bind в detach-client
bind ч confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind я resize-pane -Z
bind щ select-pane -t :.+
bind й display-panes
bind ц choose-tree -w
bind ы choose-tree -s
bind а command-prompt "find-window '%%'"
bind Ж command-prompt
bind х copy-mode

set -g @tmux-dotbar-bg "#ffffff"
set -g @tmux-dotbar-fg "#24292f"
set -g @tmux-dotbar-fg-current "#0f6cbd"
set -g @tmux-dotbar-fg-session "#616161"
set -g @tmux-dotbar-fg-prefix "#8764b8"

set -g pane-border-style "fg=colour240,bg=default"
set -g pane-active-border-style "fg=colour240,bg=default"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'

run '~/.tmux/plugins/tpm/tpm'
