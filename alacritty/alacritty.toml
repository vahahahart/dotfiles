[window.dimensions]
columns = 100
lines = 30

[font]
builtin_box_drawing = true
size = 12

[font.normal]
family = "DroidSansM Nerd Font"
style = "Regular"

[window]
opacity = 1.0

[general]
import = [
    "~/.config/alacritty/themes/vscode_light.toml",
    "~/.config/alacritty/themes/current.toml"
]
live_config_reload = true

# Distinguish Shift+Enter from Enter, including inside tmux.
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\n"
